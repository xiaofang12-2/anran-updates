<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>黯然 · 入口</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:linear-gradient(160deg,#f7f5ff 0%,#eef3ff 100%);
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       color:#1b1b28;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:420px;background:#fff;border-radius:22px;padding:28px 22px 22px;
        box-shadow:0 12px 40px rgba(60,60,120,.14)}
  h1{margin:0 0 6px;font-size:22px;letter-spacing:1px}
  .sub{color:#8a8aa0;font-size:13px;margin-bottom:20px}
  .btn{display:block;width:100%;padding:15px 16px;margin:10px 0;border-radius:14px;
       font-size:16px;font-weight:600;text-align:center;text-decoration:none;border:none;
       background:linear-gradient(135deg,#7c6cf6,#a06cf0);color:#fff;
       box-shadow:0 6px 18px rgba(124,108,246,.28)}
  .btn.alt{background:#f2f1fa;color:#5b4bd6;box-shadow:none;font-size:15px}
  .btn:active{transform:translateY(1px)}
  .tip{margin-top:16px;font-size:12px;line-height:1.7;color:#9a9aae;text-align:center}
  .bar{height:5px;background:#eee;border-radius:9px;overflow:hidden;margin:16px 0 4px}
  .bar i{display:block;height:100%;width:0;background:#7c6cf6;border-radius:9px;
         transition:width .2s linear}
</style>
</head>
<body>
<div class="card">
  <h1>黯然 · 入口</h1>
  <div class="sub" id="sub">正在为你打开…</div>
  <div class="bar"><i id="bar"></i></div>

  <a class="btn" id="main" href="http://8.218.160.91/download">打开下载站</a>
  <a class="btn alt" id="admin" href="http://8.218.160.91/admin">后台管理</a>
  <a class="btn alt" id="backup" href="https://participation-childrens-ratios-associates.trycloudflare.com/download">备用入口（主站打不开时点这个）</a>

  <div class="tip">
    若长时间没跳转，请直接点上面的按钮。<br>
    备用入口是安全连接，微信里也能打开。<br>
    这个入口地址固定不变，收藏后以后都从这儿进。
  </div>
</div>

<script>
(function(){
  var FALLBACK = "https://participation-childrens-ratios-associates.trycloudflare.com/download";
  var bar = document.getElementById("bar");
  var sub = document.getElementById("sub");
  var done = false;
  var t0 = Date.now();

  function go(url){
    if(done || !url) return;
    done = true;
    location.replace(url);
  }
  function apply(base){
    try{
      var u = new URL(base);
      document.getElementById("main").href = u.origin + "/download";
      document.getElementById("admin").href = u.origin + "/admin";
      document.getElementById("backup").href = u.origin + "/download";
    }catch(e){}
    go(base);
  }

  // 3 秒兜底：拿不到配置就直接走备用安全入口
  var timer = setInterval(function(){
    var p = Math.min(1, (Date.now()-t0)/3000);
    bar.style.width = (p*100)+"%";
    if(p >= 1){ clearInterval(timer); if(!done){ sub.textContent="自动跳转较慢，请点下方按钮"; go(FALLBACK); } }
  }, 100);

  fetch("endpoint.json?t=" + Date.now(), {cache:"no-store"})
    .then(function(r){ return r.json(); })
    .then(function(d){
      clearInterval(timer);
      if(d && d.url) apply(d.url);
      else go(FALLBACK);
    })
    .catch(function(){ clearInterval(timer); go(FALLBACK); });

  // 手动点了就别再自动跳
  ["main","admin","backup"].forEach(function(id){
    document.getElementById(id).addEventListener("click", function(){ done = true; clearInterval(timer); });
  });
})();
</script>
</body>
</html>
